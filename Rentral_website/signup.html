<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Sign Up | RentalX</title>
</head>
<body>
    <nav>
        <div class="nav__logo"><a href="index.html">RentalX</a></div>
        <ul class="nav__links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html">Cars</a></li>
        </ul>
    </nav>
    
    <div class="container" style="max-width: 500px; margin-top: 4rem;">
        <div class="dashboard__content">
            <h2 style="text-align: center;">Create Account</h2>
            <p style="text-align: center; color: var(--text-gray); margin-bottom: 2rem;">Join the premium experience</p>
            <form id="signupForm">
                <div class="form__group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" required>
                </div>
                <div class="form__group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" required>
                </div>
                <div class="form__group">
                    <label>Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="+92 XXX XXXXXXX">
                </div>
                <div class="form__group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" required>
                </div>
                <div class="form__group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirm" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem;">
                Already have an account? <a href="signin.html" style="color: var(--accent);">Sign In</a>
            </p>
        </div>
    </div>
    
    <script src="auth.js"></script>
    <script src="main.js"></script>
</body>
</html>
