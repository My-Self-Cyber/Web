<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <title>Rent a Car | RentalX</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav__header">
                <div class="nav__logo"><a href="index.html">RentalX</a></div>
            </div>
            <ul class="nav__links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="cars.html">Cars</a></li>
                <li><a href="rent.html" class="active">Rent</a></li>
                <li><button onclick="logout()" class="btn btn__secondary">Logout</button></li>
            </ul>
        </nav>
    </header>

    <section class="section__container">
        <div class="glass__card" style="max-width: 600px; margin: 0 auto;">
            <h2 class="section__header">Book Your Ride</h2>
            <p style="margin-bottom: 2rem;">Please provide journey details. Payment will be cash on pickup.</p>
            
            <form id="booking-form" class="auth__form">
                <div class="form__group">
                    <label>Select Car</label>
                    <select required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
                        <option value="">Choose a car...</option>
                        <option value="civic">Honda Civic RS (Rs. 12,600/day)</option>
                        <option value="fortuner">Toyota Fortuner (Rs. 22,400/day)</option>
                        <option value="elantra">Hyundai Elantra (Rs. 9,800/day)</option>
                    </select>
                </div>

                <div class="form__group">
                    <label>Pickup Date</label>
                    <input type="date" required>
                </div>

                <div class="form__group">
                    <label>Return Date</label>
                    <input type="date" required>
                </div>

                <div class="form__group">
                    <label>Pickup Location</label>
                    <input type="text" placeholder="e.g. Islamabad Airport, Lahore Model Town" required>
                </div>

                <button type="submit" class="btn btn__primary auth__btn">Confirm Booking</button>
            </form>
        </div>
    </section>

    <script src="main.js"></script>
    <script src="notifications.js"></script>
    <script>
        document.getElementById('booking-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Mubarak ho! Aapki booking request received ho gayi hai. Hum jald hi aap se raabta karenge.");
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
