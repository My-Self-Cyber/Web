<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Dashboard | RentalX</title>
</head>
<body>
    <nav>
        <div class="nav__logo">
            <a href="index.html">RentalX</a>
        </div>
        <ul class="nav__links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html">Cars</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><button onclick="logout()" class="btn btn-secondary">Logout</button></li>
        </ul>
    </nav>

    <div class="container">
        <div class="dashboard__grid">
            <aside class="dashboard__sidebar">
                <div class="user__profile">
                    <div class="user__avatar">
                        <i class="ri-user-star-fill"></i>
                    </div>
                    <h3 id="dashboardUserName">Loading...</h3>
                    <p>Premium Member</p>
                </div>
                <div style="margin-top: 1.5rem;">
                    <h4>Quick Actions</h4>
                    <button onclick="window.location.href='cars.html'" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                        Browse Cars
                    </button>
                </div>
            </aside>

            <div class="dashboard__content">
                <h2>My Dashboard</h2>
                <div class="stats__grid">
                    <div class="stat-card">
                        <i class="ri-car-line"></i>
                        <h3 id="totalRentals">0</h3>
                        <p>Total Rentals</p>
                    </div>
                    <div class="stat-card">
                        <i class="ri-money-rupee-circle-line"></i>
                        <h3 id="totalSpent">Rs. 0</h3>
                        <p>Total Spent</p>
                    </div>
                    <div class="stat-card">
                        <i class="ri-calendar-line"></i>
                        <h3 id="activeRentals">0</h3>
                        <p>Active Rentals</p>
                    </div>
                </div>

                <h3>My Rental History</h3>
                <div class="table__container">
                    <table id="rentalsTable">
                        <thead>
                            <tr><th>Car</th><th>Pickup</th><th>Return</th><th>Days</th><th>Total</th><th>Late Fee</th><th>Status</th><th>Action</th></tr>
                        </thead>
                        <tbody id="rentalsList">
                            <tr><td colspan="8" style="text-align: center;">No rentals yet</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="dashboard.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
