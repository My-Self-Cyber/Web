<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Our Fleet | RentalX</title>
</head>
<body>
    <nav>
        <div class="nav__logo"><a href="index.html">RentalX</a></div>
        <ul class="nav__links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html" class="active">Cars</a></li>
            <li id="dashLink" style="display:none"><a href="dashboard.html">Dashboard</a></li>
            <li id="authLinks">
                <a href="signin.html" class="btn btn-secondary">Login</a>
                <a href="signup.html" class="btn btn-primary">Sign Up</a>
            </li>
            <li id="userInfo" style="display:none">
                <span id="userName"></span>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </li>
        </ul>
    </nav>

    <div class="container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1>Our Premium Fleet</h1>
            <p style="color: var(--text-gray);">Choose from 42+ luxury and premium cars</p>
        </div>
        
        <!-- Reset Button -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
            <button onclick="resetCarsDatabase()" class="btn btn-secondary btn-sm">
                <i class="ri-refresh-line"></i> Reset Cars
            </button>
        </div>
        
        <!-- Search and Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label><i class="ri-search-line"></i> Search</label>
                <input type="text" id="filterSearch" placeholder="Search by name or brand...">
            </div>
            <div class="filter-group">
                <label><i class="ri-money-rupee-circle-line"></i> Min Price</label>
                <input type="number" id="filterMinPrice" placeholder="Min Rs.">
            </div>
            <div class="filter-group">
                <label><i class="ri-money-rupee-circle-line"></i> Max Price</label>
                <input type="number" id="filterMaxPrice" placeholder="Max Rs.">
            </div>
            <div class="filter-group">
                <label><i class="ri-group-line"></i> Seats</label>
                <select id="filterSeats">
                    <option value="">Any</option>
                    <option value="2">2+ Seats</option>
                    <option value="4">4+ Seats</option>
                    <option value="5">5+ Seats</option>
                    <option value="7">7+ Seats</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="ri-settings-3-line"></i> Transmission</label>
                <select id="filterTransmission">
                    <option value="">Any</option>
                    <option value="Auto">Automatic</option>
                    <option value="Manual">Manual</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="ri-gas-station-line"></i> Fuel Type</label>
                <select id="filterFuel">
                    <option value="">Any</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="ri-car-line"></i> Brand</label>
                <select id="filterBrand">
                    <option value="">Any</option>
                </select>
            </div>
        </div>
        
        <!-- Results Count -->
        <div id="resultsCount" style="margin-bottom: 1rem; text-align: right; color: var(--text-gray);"></div>
        
        <!-- Cars Grid -->
        <div id="carsGrid" class="car__grid">
            <!-- Cars loaded dynamically -->
        </div>
    </div>

    <script src="main.js"></script>
    <script src="auth.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
